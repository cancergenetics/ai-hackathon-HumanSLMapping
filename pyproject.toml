[project]
name = "hsl"
version = "0.1.0"
description = "Designing human HAP1 SL-mapping screens from the yeast genetic-interaction network (uses a vendored copy of the YEAST_SLs `ysl` package)"
requires-python = ">=3.12,<3.13"
# Dependencies mirror YEAST_SLs/pyproject.toml (commit 9b5dce9); versions pinned by uv.lock, seeded from the upstream lock.
dependencies = [
  "numpy",
  "scipy",
  "pandas",
  "pyarrow",
  "scikit-learn",
  "torch",
  "matplotlib",
  "requests",
  "openpyxl",
  "pytest",
  "pyyaml",
  "tqdm",
  "transformers>=5.21.0",
  "threadpoolctl",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hsl", "third_party/ysl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "third_party"]
addopts = "-p no:cacheprovider"

[tool.hatch.build]
dev-mode-dirs = ["src", "third_party"]
