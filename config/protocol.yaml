# Protocol constants (DESIGN v3.1; frozen at the freeze). Every magic number of the P0 machinery lives here; code
# reads it and never hardcodes it. Budgets: config/budgets.yaml. Seeds: config/seeds.yaml.
eval:
  ap_engine: exact_weighted         # exact weighted AP (scores sorted once, tie groups kept); no score binning
  ap_tolerance: 1.0e-12             # max |engine AP - sklearn AP| accepted by tests (float summation order only)
  precision_at_k: [10, 50]
bootstrap:
  B_query_bootstrap: 2000           # stratified query bootstrap (11 split strata), shared weights for all arms
  B_two_way: 500                    # two-way (query x array) sensitivity bootstrap, per-cell weights w_t * v_a
  chunk: 500                        # replicates per sparse product (memory bound)
stats:
  alpha_familywise: 0.025           # one-sided, Holm over <= 6 hypotheses
  ci_level: 0.95
  match_margin_frac: 0.05           # linear contrast H0: s160 - 0.95*r660 <= 0 (§6.4)
  g_star_min: 0.5                   # "matches" claim needs G* >= 0.5 (discriminating comparison)
  knee_frac: 0.95                   # random reaches 0.95 * AUPRC_r(660)
  n80_frac: 0.80
  n90_frac: 0.90
gate:
  gate_min_rel_gain: 0.02           # predictor-change gate: mean relative gain over budgets and splits
  gate_budgets: [30, 160, 330]
  gate_max_rel_loss_660: 0.01        # P2 addition, stricter than DESIGN §8: <= 1% relative loss at n = 660 (not-worse rule)
  gate_max_configs: 10              # P2 addition (multiplicity cap; not a DESIGN §8 rule)
  surrogate_within_n_spearman_min: 0.8
  surrogate_delta_spearman_min: 0.7
folds:
  n_inner_folds: 5
  dev_splits: [1, 2, 3]             # D_val = fold k, candidates = D \ fold k
  confirm_val_folds: [4, 5]         # re-split check (n <= 330 only): val = folds 4+5, candidates = folds 1-3
predictor:
  n_folds: 10                       # upstream cross-fitting folds (ctx.n_folds); min(n_folds, n) at small n
  chunk_targets: 250
  m1_hgb_small_n_prop_folds: 5      # m1_hgb prop_folds when n < m1_hgb_small_n (docs/recon.md)
  m1_hgb_small_n: 30
selector:
  randomised_greedy_top_k: 20       # each pick sampled uniformly from the top-k by gain (seeded selection stream)
  cluster_cap_per_batch: 2          # H: <= 2 genes per cluster per batch
  kmeans_k: 100                     # k-means on the external-kernel embedding of non-test genes (R1, H cap)
  cluster_embedding_dim: 32         # kernel-PCA components of the combined external kernel
  h_switch_n: 30                    # H: fixed prior before n = 30, fitted degree model from n = 30
  max_stack_lr_fits_per_round: 1
compute:
  threads_default: 3
  max_concurrent_default: 2         # n > small_job_max_n: <= 2 jobs x 3 threads
  small_job_max_n: 660              # n <= 660: <= 4 jobs x 2 threads ...
  small_job_concurrency: 4
  small_job_threads: 2
  rss_cap_gb_total: 10.0            # ... total RSS <= 10 GB
  rss_cap_gb_per_job: 6.0
  alone_min_n: 1970                 # n >= 1970 runs alone
  rss_cap_gb_alone: 12.0
  job_timeout_s: 7200
  poll_s: 2.0
labels:
  p_round_trip_tolerance: 1.0e-6    # float32 SP -> P round trip (7 dev cells have P == 0.05 exactly)
