# HAP1 constants for the Q3 translation (DESIGN v3.1 §7.3-7.4). NOT frozen and NOT in config/protocol.yaml:
# DESIGN §5 says HAP1 constants live in protocol.yaml, but the frozen protocol.yaml has no HAP1 block (checked
# 2026-10-30), so they are recorded here with their LITERATURE.md source. Changing them changes only Q3 outputs.
N_yeast:
  primary: 3283            # constructed NxN query genes (DESIGN §7.4 denominator)
  sensitivity_QuA: 4458    # query ∪ array genes (DESIGN §7.4 sensitivity)
N_HAP1:                    # viable-KO query universe among expressed nonessential genes (DESIGN §7.4)
  low: 7500                # Horizon catalogue ~7,500 KO models (LITERATURE ref 43, vendor claim)
  mid: 8500                # midpoint, used for figures
  high: 9500               # ~11,000 expressed − 1,524 essential (LITERATURE §HAP1 vs yeast table)
replicate_factor: 1.3423   # 298 screens / 222 unique lines (Billmann 2026; DESIGN "× 1.34")
billmann:
  lines: 222
  screens: 298
  library: TKOv3
  expressed_genes: 11000
  essential_genes: 1524
  negative_density: 0.0120
  per_screen_precision: 0.61   # standard threshold |qGI| > 0.3, FDR < 0.1, vs 7 queries x 4-5 replicates
  per_screen_recall: 0.37
  mean_negatives_per_query: 212   # 47,052 / 222 (LITERATURE arithmetic)
slope_b:                   # results/p1/universe/slope.json (dev, 9 draws; reported as a bound)
  n80: {b: 1.06, ci95: [0.85, 1.28]}
  n90: {b: 1.06, ci95: [0.89, 1.24]}
hap1_line_grid: [100, 222, 300, 500, 750, 1000, 1500, 2000, 3000, 4000]   # marginal-return evaluation points
bootstrap: {B: 4000, seed: 20261030}
